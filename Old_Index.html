<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>Official Race Controller</title>
      <style>
         :root {
            --bg-color: #f1f3f5;
            --card-bg: #ffffff;
            --text-primary: #1a1d20;
            --text-secondary: #6c757d;
            --primary: #0d6efd;
            --success: #198754;
            --danger: #dc3545;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
         }

         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }

         body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
         }

         .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
         }

         header {
            text-align: center;
            margin-top: calc(8px + env(safe-area-inset-top));
         }

         h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
         }

         .race-badge {
            background: #e7f1ff;
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 1.1rem;
         }

         .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
         }

         .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: var(--radius-md);
            text-align: center;
         }

         .info-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
         }

         .info-item span {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
         }

         .status-box {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            background: #e7f1ff;
            padding: 12px;
            border-radius: var(--radius-md);
            text-align: center;
            transition: all 0.3s ease;
         }

         .btn {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease, opacity 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
         }

         .btn:active:not(:disabled) {
            transform: scale(0.98);
         }

         .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
         }

         .start-btn {
            background-color: var(--success);
         }

         .stop-btn {
            background-color: var(--danger);
            display: none;
            animation: pulse 2s infinite;
         }

         @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
         }

         .console-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
         }

         .console-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
         }

         #debugConsole {
            background: #111827;
            color: #10b981;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            text-align: left;
            padding: 12px;
            border-radius: var(--radius-md);
            height: 140px;
            overflow-y: auto;
            word-break: break-all;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <header>
            <h2>⛵ Race <span id="raceNum" class="race-badge">?</span> Controller</h2>
         </header>

         <div class="card">
            <div class="info-grid">
               <div class="info-item">
                  <label>Type</label>
                  <span id="cfgType">--</span>
               </div>
               <div class="info-item">
                  <label>Audio</label>
                  <span id="cfgAudio">--</span>
               </div>
               <div class="info-item">
                  <label>Max HP</label>
                  <span id="cfgMaxHp">--</span>s
               </div>
            </div>

            <div id="status" class="status-box">
               Connecting to Google Sheets...
            </div>
         </div>

         <button
            id="startBtn"
            class="btn start-btn"
            onclick="initiateRaceAndRecord()"
            disabled
         >
            📢 START RACE
         </button>
         
         <button 
            id="stopBtn" 
            class="btn stop-btn" 
            onclick="stopRaceAndProcess()"
         >
            🏁 STOP RACE & PROCESS AUDIO
         </button>

         <audio id="audioPlayer" preload="auto" playsinline></audio>

         <div class="card console-card">
            <div class="console-title">📋 Audit Trail</div>
            <div id="debugConsole"></div>
         </div>
      </div>

      <script>
         // ⚠️ DEPLOYED GOOGLE APPS SCRIPT EXEC URL
         const GAS_WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbxd7XOCtOgpgrbICiK72fEN9cQRqH1g0F7KLqHNE-tib1ZmyUMMgKE_8hrpPzRJODOa/exec";

         let raceConfig = null;
         let mediaRecorder = null;
         let recordedChunks = [];

         function debugLog(msg) {
            console.log(msg);
            const consoleBox = document.getElementById("debugConsole");
            if (consoleBox) {
               consoleBox.innerHTML += `> ${msg}<br/>`;
               consoleBox.scrollTop = consoleBox.scrollHeight;
            }
         }

         window.onload = function () {
            debugLog("Page loaded from GitHub Pages.");
            fetchRaceConfig();
         };

         function fetchRaceConfig() {
            debugLog("Fetching race config from Google Sheets backend...");

            fetch(GAS_WEB_APP_URL)
               .then((res) => res.json())
               .then((data) => {
                  if (data.status === "success") {
                     raceConfig = data.config;
                     debugLog(
                        "✅ Config received for Race " + raceConfig.raceNumber,
                     );

                     document.getElementById("raceNum").innerText =
                        raceConfig.raceNumber;
                     document.getElementById("cfgType").innerText =
                        raceConfig.raceType
                           ? raceConfig.raceType.toUpperCase()
                           : "UNKNOWN";
                     document.getElementById("cfgAudio").innerText =
                        raceConfig.audioFileOption;
                     document.getElementById("cfgMaxHp").innerText =
                        raceConfig.maxHandicap;

                     document.getElementById("status").innerText =
                        "Ready to Start";
                     document.getElementById("startBtn").disabled = false;
                  } else {
                     debugLog("❌ Backend Error: " + data.message);
                     document.getElementById("status").innerText =
                        "❌ Error loading config";
                  }
               })
               .catch((err) => {
                  debugLog("❌ Network Error: " + err);
                  document.getElementById("status").innerText =
                     "❌ Connection Failed";
               });
         }

         async function initiateRaceAndRecord() {
            debugLog("User tapped START RACE.");
            document.getElementById("status").innerText =
               "Requesting Microphone Access...";

            try {
               // Native iOS microphone permission request
               const stream = await navigator.mediaDevices.getUserMedia({
                  audio: true,
                  video: false,
               });
               debugLog("✅ Microphone access granted ");

               document.getElementById("startBtn").style.display = "none";
               document.getElementById("stopBtn").style.display = "flex";

               recordedChunks = [];
               const options = MediaRecorder.isTypeSupported("audio/webm")
                  ? { mimeType: "audio/webm" }
                  : {};
               mediaRecorder = new MediaRecorder(stream, options);

               mediaRecorder.ondataavailable = (e) => {
                  if (e.data.size > 0) recordedChunks.push(e.data);
               };

               mediaRecorder.onstop = processAndSendAudio;
               mediaRecorder.start();
               debugLog("🎙️ Ambient audio recording active.");

               playStartAudio();
            } catch (err) {
               debugLog("❌ Mic permission error: " + err);
               document.getElementById("status").innerText =
                  "❌ Mic Permission Denied";
               alert(
                  "Microphone access is required to capture finish line audio.",
               );
            }
         }

         function playStartAudio() {
            if (!raceConfig || !raceConfig.audioUrl) {
               debugLog("⚠️ Audio URL missing.");
               return;
            }

            const audio = document.getElementById("audioPlayer");
            audio.src = raceConfig.audioUrl;
            debugLog("▶ Audio file: " + audio.src);

            audio
               .play()
               .then(() => {
                  debugLog("▶️ Countdown playing live over Bluetooth.");
                  document.getElementById("status").innerText =
                     "🔴 Countdown Playing & Mic Recording Live...";
               })
               .catch((err) => {
                  debugLog("⚠️ Audio play warning: " + err.message);
               });

            let duration =
               raceConfig.raceType === "Scratch"
                  ? raceConfig.audioFileOption === "1"
                     ? 60
                     : 120
                  : raceConfig.maxHandicap || 200;

            setTimeout(() => {
               audio.pause();
               debugLog("Countdown sequence audio complete.");
               document.getElementById("status").innerText =
                  "Start sequence complete. Recording finish line audio...";
            }, duration * 1000);
         }

         function stopRaceAndProcess() {
            debugLog("Stop button clicked.");
            document.getElementById("status").innerText =
               "Stopping ambient recording & preparing AI payload...";

            const audio = document.getElementById("audioPlayer");
            audio.pause();

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
               mediaRecorder.stop();
            }
         }

         function processAndSendAudio() {
            debugLog("Processing recorded audio...");
            const mimeType = mediaRecorder.mimeType || "audio/wav";
            const blob = new Blob(recordedChunks, { type: mimeType });
            const reader = new FileReader();

            reader.readAsDataURL(blob);
            reader.onloadend = function () {
               debugLog("Sending audio to Apps Script backend...");
               const base64Data = reader.result.split(",")[1];

               // Single request to Google Apps Script Backend
               fetch(GAS_WEB_APP_URL, {
                  method: "POST",
                  headers: { "Content-Type": "text/plain" },
                  body: JSON.stringify({
                     action: "analyzeAudio",
                     raceNumber: raceConfig.raceNumber,
                     columnIndex: raceConfig.columnIndex,
                     participants: raceConfig.participants,
                     media: base64Data,
                     mediaType: mimeType,
                  }),
               })
                  .then((res) => res.json())
                  .then((data) => {
                     if (data.status === "success") {
                        debugLog("✅ Race Scored & Sheet Updated!");
                        document.getElementById("status").innerText =
                           "✅ " + data.message;
                     } else {
                        debugLog("❌ Error: " + data.message);
                        document.getElementById("status").innerText =
                           "❌ Error: " + data.message;
                     }
                  })
                  .catch((err) => {
                     debugLog("❌ Connection Error: " + err);
                     document.getElementById("status").innerText =
                        "❌ Processing Failed";
                  });
            };
         }
      </script>
   </body>
</html>
